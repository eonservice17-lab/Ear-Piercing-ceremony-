<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7b1e1e">
<title>Invitation Video & Location</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #fff8ef;
    font-family: Arial, sans-serif; color: #4b1f16;
    display: flex; justify-content: center;
  }
  .container { width: 100%; max-width: 720px; padding: 18px; text-align: center; }
  h1 { margin: 8px 0 16px; font-size: 28px; }
  .card {
    background: white; border-radius: 18px; padding: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  video { width: 100%; border-radius: 12px; display: block; background: #000; }
  .location {
    display: inline-block; margin-top: 18px; padding: 14px 24px;
    border-radius: 30px; background: #7b1e1e; color: white;
    text-decoration: none; font-size: 18px; font-weight: bold;
  }
  .note { margin: 12px 0 4px; font-size: 14px; color: #6b5148; }
</style>
</head>
<body>
<div class="container">
  <h1>🎥 Invitation Video</h1>
  <div class="card">
    <video controls playsinline preload="metadata">
      <source src="invitation-video.mp4" type="video/mp4">
      உங்கள் browser இந்த video-வை support செய்யவில்லை.
    </video>
    <a class="location" href="https://maps.app.goo.gl/C34jRecSVLaT3e2FA" target="_blank" rel="noopener">
      📍 Open Location in Google Maps
    </a>
    <p class="note">Video-வை Play செய்து, கீழே உள்ள Location button-ஐ அழுத்தவும்.</p>
  </div>
</div>
</body>
</html>
